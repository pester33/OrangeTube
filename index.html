<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orange Tube</title>
  <meta name="theme-color" content="#ff7a00" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a href="#/" class="brand">
        <img src="assets/logo.svg" alt="" width="32" height="32" />
        <span>Orange<b>Tube</b></span>
      </a>
    </div>

    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search Orange Tube" autocomplete="off" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
    </form>

    <div class="tb-right" id="authArea">
      <!-- filled by app.js -->
    </div>
  </header>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg><span>Home</span></a>
    <a href="#/trending" data-nav="trending"><svg viewBox="0 0 24 24"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3s0 3 2 3c0-4 2-6 2-10z"/></svg><span>Trending</span></a>
    <a href="#/subscriptions" data-nav="subscriptions"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M6 4h12M10 11l5 2.5-5 2.5z"/></svg><span>Subscriptions</span></a>
    <hr />
    <a href="#/liked" data-nav="liked"><svg viewBox="0 0 24 24"><path d="M7 21V10l5-7 1 1c.6.6.8 1.4.6 2.2L13 10h6a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 21zM3 10h4v11H3z"/></svg><span>Liked videos</span></a>
    <a href="#/me" data-nav="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Your channel</span></a>
    <a href="#/upload" data-nav="upload"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/></svg><span>Upload</span></a>
    <div class="side-foot">© Orange Tube</div>
  </aside>

  <!-- ===== MAIN VIEW ===== -->
  <main id="view" class="view"></main>

  <!-- ===== AUTH MODAL ===== -->
  <div class="modal-backdrop" id="authModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="modal-close icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="modal-brand">
        <img src="assets/logo.svg" alt="" width="48" height="48" />
        <h2 id="authTitle">Welcome to Orange Tube</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="signup">Sign up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Password<input type="password" name="password" required minlength="6" autocomplete="current-password" /></label>
        <button class="btn primary block" type="submit">Log in</button>
        <button class="link-btn" type="button" id="forgotBtn">Forgot password?</button>
      </form>

      <form id="signupForm" class="auth-form" hidden>
        <label>Channel name<input type="text" name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_\.]+" title="Letters, numbers, _ and . only" /></label>
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password" /></label>
        <label>Confirm password<input type="password" name="confirm" required minlength="6" autocomplete="new-password" /></label>
        <button class="btn primary block" type="submit">Create account</button>
      </form>

      <p class="auth-msg" id="authMsg"></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
